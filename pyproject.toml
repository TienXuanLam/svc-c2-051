[project]
name = "svc-c2-051"
version = "0.1.0"
description = "CustomerSuccessRenewalRiskAssessmentAccountHealthReportAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by the CI environment per repo arm, resolved on PYTHONPATH or
# installed from the package registry depending on the repo's build mode.
# Pinning it here would make `pip install -e .` fail because it is not
# resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# Every node/graph class subclasses a framework base (FunctionNode, AgentBaseGraph)
# whose exact generic parameters are not visible to mypy without the wheel installed
# in every dev environment; disallow_subclassing_any=true (mypy --strict default)
# would fail every node/graph class definition purely on that basis. Confirmed
# pattern from prior template remediations.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "yaml.*"]
ignore_missing_imports = true
